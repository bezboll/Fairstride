<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OWAS Posture Risk Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#17202b;--mut:#5d6a7a;--line:#d3dbe4;--acc:#1f5fbf;--tint:#e4eefb;--a1:#2e9d5b;--a2:#f2c200;--a3:#f08a1c;--a4:#d63b3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--card:#171f29;--ink:#eaf0f7;--mut:#94a3b5;--line:#2a3543;--acc:#7aa9f5;--tint:#1d2c42}}
:root[data-theme="dark"]{--bg:#0e141b;--card:#171f29;--ink:#eaf0f7;--mut:#94a3b5;--line:#2a3543;--acc:#7aa9f5;--tint:#1d2c42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:clamp(22px,3.2vw,34px);margin:4px 0 2px;font-weight:800}
h2{font-size:clamp(20px,2.6vw,28px);margin:18px 0 2px;font-weight:800}
.mut{color:var(--mut)}
.prog{display:flex;gap:6px;margin:14px 0 0}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.opt{position:relative;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 8px 12px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .15s,background .15s,transform .15s}
.opt:hover,.opt:focus-visible{border-color:var(--acc);outline:none}
.opt.sel{border-color:var(--acc);background:var(--tint);transform:scale(.97)}
.opt svg{display:block;width:100%;height:110px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:700px){.opt svg{height:150px}}
.opt b{display:block;margin-top:6px}.opt small{display:block;color:var(--mut);font-size:13px}
.btn{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--acc);outline:none}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
[data-theme="dark"] .btn.p{color:#0e141b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#0e141b}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.pre .btn{padding:4px 12px;font-size:14px}
.res{display:grid;gap:16px;margin-top:16px}
@media(min-width:1000px){.res{grid-template-columns:1.7fr 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.cap{min-height:1.5em;font-weight:600;margin-bottom:8px}
.tbl{display:grid;grid-template-columns:2.8em repeat(21,1fr);gap:2px;font-size:clamp(8px,1.4vw,14px);font-weight:600}
.tbl div{text-align:center;padding:.4em 0;border-radius:3px;transition:opacity .5s,transform .45s}
.tbl .hd{color:var(--mut);font-weight:600}
.tbl .hl{background:var(--acc);color:#fff}
.tbl .off{opacity:.1}
.tbl .hit{transform:scale(1.7);position:relative;z-index:2;box-shadow:0 0 0 3px var(--ink)}
.c1{background:var(--a1);color:#fff}.c2{background:var(--a2);color:#1a1a1a}.c3{background:var(--a3);color:#1a1a1a}.c4{background:var(--a4);color:#fff}
.out{opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s;pointer-events:none}
.out.on{opacity:1;transform:none;pointer-events:auto}
.badge{border-radius:10px;padding:14px 16px}
.badge .n{font-size:clamp(40px,6vw,64px);font-weight:800;line-height:1}
.badge p{margin:6px 0 0;font-weight:600}
.code{margin:12px 0 4px;color:var(--mut)}
.code b{color:var(--ink);letter-spacing:.15em}
.out ul{margin:6px 0 0;padding-left:20px}.out li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--tint);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.note{margin-top:10px;font-size:14px;color:var(--mut);border-left:3px solid var(--a3);padding-left:10px}
.num{position:absolute;top:8px;left:8px;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:var(--card);font-weight:800;font-size:14px;display:grid;place-items:center}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.strip button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;cursor:pointer;line-height:1.2;min-width:0}
.strip .cur{border-color:var(--acc);background:var(--tint)}
.strip button:disabled{opacity:.5;cursor:default}
.strip span{display:block;font-size:13px;color:var(--mut)}
.strip b{display:block;font-size:clamp(22px,4vw,32px);font-weight:800}
.strip small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.tr.sel{border-color:var(--acc);background:var(--tint)}
#photo{margin-top:16px}
#photo img{display:block;width:100%;max-height:75vh;object-fit:contain;border-radius:6px}
.fn{color:var(--mut);font-size:13px;margin-top:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app">
<h1>OWAS posture risk</h1>
<div class="mut">Describe one working posture. The tool looks up its risk in the OWAS table.</div>
<div class="row pre"><span class="mut">Photo to analyse:</span><button class="btn tr" onclick="trial(1)">Trial 1</button><button class="btn tr" onclick="trial(2)">Trial 2</button><button class="btn tr" onclick="trial(3)">Trial 3</button></div>
<div id="app"></div>
<div id="photo"></div>
<p class="fn">Uses the standard OWAS lookup table (Karhu et al., 1977) as printed in Erdoğan et al. (2024). A screening aid, not a medical assessment.</p>
</div>
<script>
const T={"11":"111111111222222111111","12":"111111111222222111111","13":"111111111223223111112","21":"223223223333333222233","22":"223223233344344334234","23":"334223333344444444234","31":"111111112333444111111","32":"223111112444444333111","33":"223111233444444444111","41":"233223223444444444234","42":"334234334444444444234","43":"444234334444444444234"};
const ac=(b,a,l,d)=>+T[""+b+a][(l-1)*3+d-1];
const L="M30 44L27 76M30 44L33 76";
const S=[
{k:"Back",q:"How is the back positioned?",h:"Pick the closest match. 20° or more counts as bent.",o:[
["Straight","Upright, under 20°",[30,14,"M30 20V44"+L+"M30 26L22 40"]],
["Bent","Forward or back, 20°+",[49,20,"M30 44L44 26"+L+"M44 28L50 44"]],
["Twisted","Twisted or bent sideways",[41,19,"M30 44L38 26M30 33L47 25"+L]],
["Bent and twisted","Both at once",[49,20,"M30 44L44 26M38 20L52 32"+L]]]},
{k:"Arms",q:"Where are the arms?",h:"Compare the hands and elbows with shoulder height.",o:[
["Both low","Both below shoulders",[30,14,"M30 20V44"+L+"M30 26L20 42M30 26L40 42"]],
["One high","One at or above shoulder",[30,14,"M30 20V44"+L+"M30 26L20 42M30 26L42 12"]],
["Both high","Both at or above shoulders",[30,14,"M30 20V44"+L+"M30 26L18 12M30 26L42 12"]]]},
{k:"Legs",q:"What are the legs doing?",h:"Choose the posture that carries the body weight.",o:[
["Sitting","Weight on the seat",[22,14,"M22 20V44M22 44H44M44 44V70M14 48H36M16 48V72"]],
["Standing","Both legs straight",[30,14,"M30 20V44"+L]],
["One leg","Standing on one straight leg",[30,14,"M30 20V44M30 44V76M30 44L42 58L46 74"]],
["Knees bent","Both knees bent",[30,14,"M30 20V42M30 42L42 58L30 74M30 42L46 58L36 74"]],
["One bent leg","Weight on one bent leg",[30,14,"M30 20V44M30 44L42 60L30 76M30 44L26 70"]],
["Kneeling","On one or both knees",[30,14,"M30 20V44M30 44V66H50"]],
["Walking","Moving around",[30,14,"M30 20V44M30 44L20 76M30 44L42 60L44 76M30 26L22 40M30 26L38 40"]]]},
{k:"Load",q:"How heavy is the load or force?",h:"The weight lifted or the force needed.",o:[
["Light","10 kg or less",[24,14,"M24 20V46M24 46L21 76M24 46L28 76M24 28L34 40","M32 36h10v10h-10z"]],
["Medium","10 to 20 kg",[24,14,"M24 20V46M24 46L21 76M24 46L28 76M24 28L34 40","M32 32h16v16h-16z"]],
["Heavy","Over 20 kg",[24,14,"M24 20V46M24 46L21 76M24 46L28 76M24 28L34 40","M32 26h22v22h-22z"]]]}];
const AC=[["Normal posture","No action is required."],["Slightly harmful","Corrective action is needed in the near future."],["Harmful","Corrective action should be taken as soon as possible."],["Severely harmful","Corrective action is required immediately."]];
const $=id=>document.getElementById(id),w=ms=>new Promise(r=>setTimeout(r,ms));
let sel=[0,0,0,0],st=0,run=0,edit=false,img=0;
const fig=f=>`<svg viewBox="0 0 60 80" aria-hidden="true"><circle cx="${f[0]}" cy="${f[1]}" r="6"/><path d="${f[2]}"/>${f[3]?`<path d="${f[3]}"/>`:""}</svg>`;
function render(){run++;const app=$("app");
 if(st>3){result();return}
 const s=S[st];
 let h=`<div class="prog">${[0,1,2,3,4].map(i=>`<i class="${i<=st?"on":""}"></i>`).join("")}</div>${strip()}<h2>${s.q}</h2><div class="mut">${s.h}</div><div class="grid">`;
 s.o.forEach((o,i)=>h+=`<button class="opt${sel[st]==i+1?" sel":""}" onclick="pick(${i+1},this)"><span class="num">${i+1}</span>${fig(o[2])}<b>${o[0]}</b><small>${o[1]}</small></button>`);
 h+=`</div><div class="row">${st>0&&!edit?`<button class="btn" onclick="st--;render()">Previous step</button>`:""}${edit?`<button class="btn" onclick="st=4;render()">Back to result</button>`:""}</div>`;
 app.innerHTML=h;}
function pick(i,el){sel[st]=i;el.classList.add("sel");$("strip").outerHTML=strip();setTimeout(()=>{st=edit?4:st+1;render()},300)}
function go(i){edit=sel.every(Boolean);st=i;render()}
function reset(){sel=[0,0,0,0];st=0;edit=false;render()}
function result(){
 let h=`<div class="prog">${[0,1,2,3,4].map(()=>`<i class="on"></i>`).join("")}</div>${strip()}<div class="res"><div class="card"><div class="cap" id="cap"></div><div class="tbl" id="tbl">`;
 h+="<div></div>";for(let l=1;l<=7;l++)h+=`<div class="hd" id="lh${l}" style="grid-column:span 3">Legs ${l}</div>`;
 h+="<div></div>";for(let l=1;l<=7;l++)for(let d=1;d<=3;d++)h+=`<div class="hd" id="dh${l}${d}">${d}</div>`;
 for(let b=1;b<=4;b++)for(let a=1;a<=3;a++){h+=`<div class="hd" id="rl${b}${a}">${b}·${a}</div>`;
  for(let c=0;c<21;c++){const v=T[""+b+a][c],l=(c/3|0)+1,d=c%3+1;h+=`<div class="k c${v}" data-r="${b}${a}" data-l="${l}" data-d="${d}">${v}</div>`}}
 h+=`</div><div class="mut" style="font-size:13px;margin-top:8px">Rows show back and arms, column groups show legs, and the three columns in each group show load.</div></div><div class="card out" id="out">${outHTML()}</div></div>`;
 $("app").innerHTML=h;play();}
function outHTML(){const[b,a,l,d]=sel,v=ac(b,a,l,d),t=[];
 if(v>1){if(b!=1)t.push("Keep the back upright and bring the work to about waist height.");
  if(b>2)t.push("Avoid twisting: turn with the feet and place materials in front of you.");
  if(d>1)t.push("Reduce the load below 10 kg, use a lifting aid or share the lift.");
  if(a>1)t.push("Keep the hands below shoulder height by lowering the work or raising the worker.");
  if(l==6)t.push("Avoid kneeling: raise the work or use a knee support.");
  if(l==4||l==5)t.push("Avoid standing with bent knees: use a stool or raise the workpiece.");
  if(!t.length)t.push("Rotate tasks and add short breaks to cut the time spent in this posture.")}
 return `<div class="badge c${v}"><div class="n">AC${v}</div><p>${AC[v-1][0]}. ${AC[v-1][1]}</p></div><div class="code">OWAS code <b>${sel.join(" ")}</b></div>${t.length?`<b>What to change</b><ul>${t.slice(0,4).map(x=>`<li>${x}</li>`).join("")}</ul>`:""}<div class="row"><button class="btn" onclick="play()">Replay lookup</button><button class="btn p" onclick="reset()">New assessment</button></div>`}
async function play(){const id=++run,[b,a,l,d]=sel,r=""+b+a,v=ac(b,a,l,d),K=[...document.querySelectorAll(".k")],cap=t=>$("cap").textContent=t;
 K.forEach(k=>k.className="k c"+k.textContent);document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl"));$("out").classList.remove("on");
 await w(500);if(id!=run)return;
 cap(`Back ${b} and arms ${a} select this row`);K.forEach(k=>{if(k.dataset.r!=r)k.classList.add("off")});$("rl"+r).classList.add("hl");await w(1200);if(id!=run)return;
 cap(`Legs ${l} select these three columns`);K.forEach(k=>{if(k.dataset.r==r&&k.dataset.l!=l)k.classList.add("off")});$("lh"+l).classList.add("hl");await w(1200);if(id!=run)return;
 cap(`Load ${d} selects this cell`);K.forEach(k=>{if(k.dataset.r==r&&k.dataset.l==l){if(k.dataset.d!=d)k.classList.add("off");else k.classList.add("hit")}});$("dh"+l+d).classList.add("hl");await w(1100);if(id!=run)return;
 cap(`Result: action category ${v}`);$("out").classList.add("on");$("out").scrollIntoView({behavior:"smooth",block:"nearest"});}
const strip=()=>`<div class="strip" id="strip">${S.map((q,i)=>{const x=sel[i],cur=st==i;return `<button class="${cur?"cur":""}" ${x||cur?"":"disabled"} onclick="go(${i})"><span>${q.k}</span><b>${x||"–"}</b><small>${x?q.o[x-1][0]:"not chosen"}</small></button>`}).join("")}</div>`;
function imgErr(e){const d=document.createElement("div");d.className="mut";d.textContent=e.getAttribute("src")+" was not found. Put it in the same folder as this page.";e.replaceWith(d)}
function trial(i){img=img==i?0:i;document.querySelectorAll(".tr").forEach((b,j)=>b.classList.toggle("sel",img==j+1));
 $("photo").innerHTML=img?`<div class="card"><div class="cap">Trial ${img}</div><a href="trial${img}.jpg" target="_blank"><img src="trial${img}.jpg" alt="Trial ${img} working posture" onerror="imgErr(this)"></a></div>`:"";
 if(img)$("photo").scrollIntoView({behavior:"smooth",block:"nearest"})}
render();
</script></body></html>
